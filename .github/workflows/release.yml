name: release

# v1.2.3 の形のタグを付けると、実行ファイルとchecksums.txtを作り、下書きのリリースにする。
# 署名（checksums.txt.sig）は、秘密鍵を持つ人が手元で scripts/sign-release.sh を実行して添付し、公開する（GitHubに秘密鍵を置かない）。
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/webproxied-agent_linux_$arch ./cmd/webproxied-agent
          done
          (cd dist && sha256sum webproxied-agent_linux_* > checksums.txt)
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "$GITHUB_REF_NAME" --notes "署名（checksums.txt.sig）を添付してから公開します。"
